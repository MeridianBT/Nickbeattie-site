<!doctype html>
<!-- Source for assets/img/og-image.png (1200x630). Regenerate with: node tools/render-og.mjs -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>OG image template</title>
<style>
  @font-face { font-family: "Newsreader"; src: url("../assets/fonts/newsreader-latin-wght-normal.woff2") format("woff2"); font-weight: 200 800; }
  @font-face { font-family: "Newsreader"; src: url("../assets/fonts/newsreader-latin-wght-italic.woff2") format("woff2"); font-weight: 200 800; font-style: italic; }
  @font-face { font-family: "IBM Plex Sans"; src: url("../assets/fonts/ibm-plex-sans-latin-500-normal.woff2") format("woff2"); font-weight: 500; }
  html, body { margin: 0; }
  body { width: 1200px; height: 630px; background: #FBFAF8; color: #262626; font-family: "IBM Plex Sans", sans-serif; }
  .card { box-sizing: border-box; width: 1200px; height: 630px; padding: 84px 96px; display: grid; grid-template-columns: 170px 1fr; column-gap: 40px; position: relative; }
  .gutter { border-right: 1px solid #D9D3CB; }
  .label { font-size: 17px; font-weight: 500; letter-spacing: .14em; text-transform: uppercase; color: #B0522A; margin: 14px 0 0; }
  h1 { font-family: "Newsreader", Georgia, serif; font-weight: 400; font-size: 128px; line-height: .95; letter-spacing: -.025em; margin: 0; }
  .rule { width: 180px; height: 3px; background: #B0522A; margin: 44px 0 38px; }
  p.lede { font-family: "Newsreader", Georgia, serif; font-size: 44px; line-height: 1.2; margin: 0; max-width: 18em; }
  .url { position: absolute; left: 306px; bottom: 64px; font-size: 20px; letter-spacing: .06em; color: #6E6A66; }
</style>
</head>
<body>
  <div class="card">
    <div class="gutter"><p class="label">General<br>Manager</p></div>
    <div>
      <h1>Nick Beattie</h1>
      <div class="rule"></div>
      <p class="lede">I build and fix things: sales channels, operating models, mergers, and the teams that run them.</p>
    </div>
    <p class="url">nickbeattie.com</p>
  </div>
</body>
</html>
